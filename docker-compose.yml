services:
  postgres:
    image: postgres:16-alpine
    container_name: worm-demo-postgres
    network_mode: host
    environment:
      POSTGRES_DB: worm_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGPORT: "5433"
    command: ["postgres", "-p", "5433"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d worm_demo -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: worm-demo-app
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5433/worm_demo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_FLYWAY_ENABLED: "true"
    restart: unless-stopped

volumes:
  postgres_data:
