spring:
  datasource:
    # Default to a local Postgres for integration tests. You can override with env vars.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/worm_demo}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always

worm:
  enable-schema-validation: false

  query:
    repository:
      base-packages:
        - br.com.worm.demo

logging:
  level:
    root: WARN
    br.com.liviacare.worm: off
    br.com.liviacare.worm.orm.sql: off
    org.hibernate.SQL: WARN
    org.hibernate.orm: WARN
    org.springframework: WARN
    com.zaxxer.hikari: WARN

