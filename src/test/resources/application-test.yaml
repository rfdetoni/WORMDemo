spring:
  datasource:
    url: jdbc:h2:mem:worm_demo_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always

worm:
  enable-schema-validation: false
  query:
    repository:
      base-packages:
        - br.com.worm.demo

